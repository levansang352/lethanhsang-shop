<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LETHANHSANG.SHOP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#b30000;
padding:20px;
text-align:center;
box-shadow:0 0 15px red;
}

header h1{
font-size:40px;
}

header p{
margin-top:10px;
font-size:18px;
}

.banner{
padding:60px 20px;
text-align:center;
background:linear-gradient(#111,#222);
}

.banner h2{
font-size:32px;
color:#ff4444;
}

.banner p{
margin-top:15px;
font-size:18px;
}

.button{
display:inline-block;
margin-top:25px;
padding:15px 35px;
background:#ff0000;
color:#fff;
text-decoration:none;
border-radius:10px;
font-weight:bold;
transition:0.3s;
}

.button:hover{
background:#cc0000;
}

.menu{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
padding:30px;
}

.card{
background:#222;
padding:20px;
width:220px;
border-radius:12px;
text-align:center;
box-shadow:0 0 10px rgba(255,0,0,.3);
}
